<!DOCTYPE html>
<html lang="en">

  <meta
    name="description"
    content="Completed MiniGolf projects and installations."

<body>

  <!-- ============ HEADER ============ -->

  <header class="site-header">
    <div class="wrap header-inner">

      <nav class="nav-side nav-left" aria-label="Primary">
        <a href="index.html#mini-wood">Mini Wood</a>
        <a href="index.html#wood-park">Wood Park</a>
        <a href="Completed-work.html">Completed work</a>
      </nav>

      <a href="index.html#top" class="logo">
        <img

          alt="MiniGolf"

      </a>

      <nav class="nav-side nav-right" aria-label="Secondary">
        <a href="index.html#contact">Contact us</a>
      </nav>

    </div>
  </header>


<!-- ============ COMPLETED WORK ============ -->

<main class="completed-work-page">


  <!-- =====================================================
       INTRO SCREEN
       ===================================================== -->

  <section class="completed-work-intro">

    <div class="wrap">

      <p class="eyebrow-line">
        Our projects
      </p>

      <h1>
        Completed work
      </h1>

      <p>
        Take a look at some of the mini-golf projects we have completed.
      </p>

    </div>

  </section>


  <!-- =====================================================
       PROJECTS
       ===================================================== -->

  <section class="completed-projects">


    <!-- FIVE NAVIGATION DOTS -->

    <div class="completed-dots" aria-label="Project navigation">

      <!-- DOT 1 = INTRO -->

      <button
        class="completed-dot active"
        data-project="0"
        aria-label="Introduction">
      </button>


      <!-- DOT 2 = PROJECT 01 -->

      <button
        class="completed-dot"
        data-project="1"
        aria-label="Project 01">
      </button>


      <!-- DOT 3 = PROJECT 02 -->

      <button
        class="completed-dot"
        data-project="2"
        aria-label="Project 02">
      </button>


      <!-- DOT 4 = PROJECT 03 -->

      <button
        class="completed-dot"
        data-project="3"
        aria-label="Project 03">
      </button>


      <!-- DOT 5 = PROJECT 04 -->

      <button
        class="completed-dot"
        data-project="4"
        aria-label="Project 04">
      </button>

    </div>


    <!-- ===================================================
         PROJECT 01
         =================================================== -->

    <article class="completed-project">

      <div class="completed-image completed-gallery">

  <button class="gallery-arrow gallery-prev" aria-label="Previous image">
    &#10094;
  </button>

  <div class="gallery-images">

    <img
      src="images/completed-work/project1.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img active"
    >

    <img
      src="images/completed-work/project1_1.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img"
    >

    <img
      src="images/completed-work/project1_2.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img"
    >

    <img
      src="images/completed-work/project1_3.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img"
    >

    <img
      src="images/completed-work/project1_4.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img"
    >

  </div>

  <button class="gallery-arrow gallery-next" aria-label="Next image">
    &#10095;
  </button>

</div>

    </article>


    <!-- ===================================================
         PROJECT 02
         =================================================== -->

    <article class="completed-project reverse">

      <div class="completed-image completed-gallery">

  <button class="gallery-arrow gallery-prev" aria-label="Previous image">
    &#10094;
  </button>

  <div class="gallery-images">

    <img
      src="images/completed-work/project2.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img active"
    >

    <img
      src="images/completed-work/project2_1.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img"
    >

    <img
      src="images/completed-work/project2_2.png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img"
    >

  </div>

  <button class="gallery-arrow gallery-next" aria-label="Next image">
    &#10095;
  </button>

</div>

    </article>


    <!-- ===================================================
         PROJECT 03
         =================================================== -->

      <article class="completed-project reverse"></article>

    <div class="completed-image completed-gallery">

  <button class="gallery-arrow gallery-prev" aria-label="Previous image">
    &#10094;
  </button>

  <div class="gallery-images">

    <img
      src="images/completed-work/project3png"
      alt="Completed MiniGolf project"
      class="completed-gallery-img active"

    <img
      src="images/completed-work/project3_1.png"

</div>

      src="images/completed-work/project4.png"

    >

    <img
      src="images/completed-work/project4_1.png"
      alt="Completed MiniGolf project"

    <img

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-hidden="true"
    aria-label="Enlarged view"

    <img
